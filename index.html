<!doctype html><html class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PX1 Monitor</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script>tailwind.config={theme:{extend:{colors:{bg:'#111217',panel:'#181a20',line:'#30333b',muted:'#9298a6',cyan:'#35c5d2',good:'#4fbe79',warn:'#e6a84a',bad:'#e05d6f'}}}}</script></head><body class="bg-bg text-slate-200"><div id="app"></div><script>
const {createApp,ref,reactive,computed,watch,onMounted,onBeforeUnmount,nextTick,defineComponent}=Vue,CFG={MOCK_MODE:false,WS_PATH:'/metrics',MAX:48},num=new Intl.NumberFormat();
const Panel={template:'<section class="border border-line bg-panel p-4"><slot/></section>'};
const Stat=defineComponent({components:{Panel},props:['name','value','detail'],template:'<Panel><p class="text-[11px] uppercase tracking-wider text-muted">{{name}}</p><p class="mt-2 font-mono text-2xl font-semibold text-white">{{value}}</p><p class="mt-1 text-xs text-muted">{{detail}}</p></Panel>'});
const Graph=defineComponent({components:{Panel},props:['title','labels','series'],setup(p){let c;const el=ref();const render=()=>{if(!el.value)return;let ds=p.series.map((x,i)=>({label:x.label,data:[...x.data],borderColor:x.color,backgroundColor:i?'transparent':'rgba(53,197,210,.12)',fill:p.series.length===1,tension:.3,pointRadius:0,borderWidth:1.7}));if(!c)c=new Chart(el.value,{type:'line',data:{labels:[...p.labels],datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#9298a6',boxWidth:10,font:{size:11}}}},scales:{x:{ticks:{color:'#687080',maxTicksLimit:6,font:{size:10}},grid:{color:'#252831'}},y:{ticks:{color:'#687080',font:{size:10}},grid:{color:'#252831'}}}}});else{c.data.labels=[...p.labels];c.data.datasets=ds;c.update('none')}};onMounted(render);watch(()=>[p.labels,p.series],render,{deep:true});onBeforeUnmount(()=>c?.destroy());return{el}},template:'<Panel><h2 class="mb-3 text-sm font-medium text-white">{{title}}</h2><div class="h-60"><canvas ref="el"></canvas></div></Panel>'});
const Workers=defineComponent({components:{Panel},props:['items'],setup(){const up=s=>{s=s|0;return String(s/3600|0).padStart(2,'0')+':'+String(s/60%60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},color=s=>s==='healthy'?'text-good':s==='degraded'?'text-warn':'text-bad';return{up,color}},template:'<Panel><div class="mb-3 flex justify-between"><h2 class="text-sm font-medium text-white">Workers</h2><span class="font-mono text-xs text-muted">{{items.length}} active</span></div><div class="overflow-x-auto"><table class="w-full min-w-[650px] text-left font-mono text-xs"><thead class="border-y border-line text-[10px] uppercase tracking-wider text-muted"><tr><th class="py-2">ID</th><th>Uptime</th><th>Keepalive miss</th><th>Last reconnect</th><th>Health</th></tr></thead><tbody><tr v-for="w in items" class="border-b border-line/60"><td class="py-3 text-cyan">{{w.worker_id}}</td><td>{{up(w.uptime_seconds)}}</td><td>{{w.keepalive_miss_count||0}}</td><td class="text-muted">{{w.last_reconnect||"never"}}</td><td><span :class="color(w.health_status)">● {{w.health_status||"healthy"}}</span></td></tr></tbody></table></div></Panel>'});
const Logs=defineComponent({components:{Panel},props:['items'],setup(p){let f=ref('all'),pause=ref(false),box=ref(),rows=computed(()=>p.items.filter(x=>f.value==='all'||x.severity===f.value)),color=s=>s==='error'?'text-bad':s==='warn'?'text-warn':'text-cyan';watch(()=>p.items.length,async()=>{if(!pause.value){await nextTick();box.value.scrollTop=box.value.scrollHeight}});return{f,pause,box,rows,color}},template:'<Panel><div class="mb-3 flex justify-between"><h2 class="text-sm font-medium text-white">Log stream</h2><div><select v-model="f" class="border border-line bg-bg p-1 font-mono text-xs"><option value="all">all</option><option>error</option><option>warn</option><option>info</option></select><button @click="pause=!pause" class="ml-2 border border-line px-2 py-1 font-mono text-xs">{{pause?"resume":"pause"}}</button></div></div><div ref="box" class="h-64 overflow-auto bg-[#0d0e12] p-3 font-mono text-xs leading-6"><p v-for="l in rows"><span class="text-muted">{{new Date(l.ts).toLocaleTimeString()}}</span> <b :class="color(l.severity)">{{l.severity}}</b> {{l.message}}</p></div></Panel>'});
const App={components:{Stat,Graph,Workers,Logs},setup(){const live=ref(false),retry=ref(1),range=ref('Last 15m'),liveClass=computed(()=>live.value?'text-good':'text-bad'),m=reactive({active_connections:0,capacity_used:0,throughput:{up_mbps:0,down_mbps:0},reconnect_rate:0,circuit_breaker:'CLOSED',fd:{used:0,limit:1024,percent:0},latency:{p50:0,p95:0,p99:0},backpressure_buffer_depth:0}),workers=reactive(new Map()),logs=ref([]),h=reactive({l:[],c:[],p50:[],p95:[],p99:[],b:[]});let rt,mt;const add=(k,v)=>{h[k].push(v);if(h[k].length>CFG.MAX)h[k].shift()},receive=x=>{if(x.type==='metrics'){Object.assign(m,x.payload);h.l.push(new Date(x.ts).toLocaleTimeString());if(h.l.length>CFG.MAX)h.l.shift();add('c',m.active_connections);add('p50',m.latency.p50);add('p95',m.latency.p95);add('p99',m.latency.p99);add('b',m.backpressure_buffer_depth)}else if(x.type==='worker_update')workers.set(x.payload.worker_id,x.payload);else if(x.type==='log'){logs.value.push({...x.payload,ts:x.ts});if(logs.value.length>400)logs.value.shift()}},connect=()=>{if(CFG.MOCK_MODE)return mock();let ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${CFG.WS_PATH}`);ws.onopen=()=>{live.value=true;retry.value=1};ws.onmessage=e=>receive(JSON.parse(e.data));ws.onclose=()=>{live.value=false;rt=setTimeout(connect,retry.value*1000);retry.value=Math.min(retry.value*2,30)};ws.onerror=()=>ws.close()},mock=()=>{live.value=true;['worker-a13','worker-b08','worker-c22'].forEach((worker_id,i)=>receive({type:'worker_update',payload:{worker_id,uptime_seconds:6800+i*300,keepalive_miss_count:0,last_reconnect:'never',health_status:'healthy'}}));mt=setInterval(()=>{let a=3+Math.random()*3;receive({type:'metrics',ts:Date.now(),payload:{active_connections:a|0,capacity_used:a*5|0,throughput:{up_mbps:Math.random()*.4,down_mbps:.7+Math.random()},reconnect_rate:Math.random(),circuit_breaker:'CLOSED',fd:{used:55,limit:1024,percent:5},latency:{p50:18+Math.random()*8,p95:40+Math.random()*18,p99:70+Math.random()*30},backpressure_buffer_depth:Math.random()*24000}});receive({type:'log',ts:Date.now(),payload:{severity:'info',message:'pool keepalive acknowledged'}})},2000)};onMounted(connect);onBeforeUnmount(()=>{clearTimeout(rt);clearInterval(mt)});return{live,retry,range,liveClass,m,workers:computed(()=>[...workers.values()]),logs,h,num}},template:'<main class="mx-auto max-w-[1800px] p-4 lg:p-6"><header class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-line pb-4"><div><p class="font-mono text-[11px] uppercase tracking-[.16em] text-cyan">PX1 mining proxy</p><h1 class="text-xl font-semibold text-white">Realtime operations</h1></div><div class="flex gap-4 font-mono text-xs"><span :class="liveClass">● {{live?"connected":"reconnecting "+retry+"s"}}</span><select v-model="range" class="border border-line bg-panel px-2 py-1"><option>Last 15m</option><option>Last 1h</option><option>Last 6h</option></select></div></header><section class="grid gap-3 [grid-template-columns:repeat(auto-fit,minmax(190px,1fr))]"><Stat name="Active connections" :value="num.format(m.active_connections)" :detail="m.capacity_used+\'% capacity used\'"/><Stat name="Throughput" :value="(m.throughput.up_mbps+m.throughput.down_mbps).toFixed(2)+\' Mbps\'" :detail="\'up \'+m.throughput.up_mbps.toFixed(2)+\' / down \'+m.throughput.down_mbps.toFixed(2)"/><Stat name="Reconnect rate" :value="m.reconnect_rate.toFixed(1)+\'%\'" detail="last 5 minutes"/><Stat name="Circuit breaker" :value="m.circuit_breaker" :detail="m.circuit_breaker===\'CLOSED\'?\'upstream available\':\'protection active\'"/><Stat name="FD usage" :value="m.fd.percent+\'%\'" :detail="m.fd.used+\' / \'+m.fd.limit+\' descriptors\'"/></section><section class="mt-3 grid gap-3 xl:grid-cols-2"><Graph title="Connections over time" :labels="h.l" :series="[{label:\'connections\',data:h.c,color:\'#35c5d2\'}]"/><Graph title="Latency p50 / p95 / p99" :labels="h.l" :series="[{label:\'p50\',data:h.p50,color:\'#35c5d2\'},{label:\'p95\',data:h.p95,color:\'#e6a84a\'},{label:\'p99\',data:h.p99,color:\'#e05d6f\'}]"/></section><section class="mt-3 grid gap-3 xl:grid-cols-[1.35fr_1fr]"><Workers :items="workers"/><Graph title="Backpressure buffer depth" :labels="h.l" :series="[{label:\'bytes\',data:h.b,color:\'#7aa7ff\'}]"/></section><section class="mt-3"><Logs :items="logs"/></section></main>'};createApp(App).mount('#app');
</script></body></html>
